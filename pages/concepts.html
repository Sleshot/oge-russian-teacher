<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>База понятий | ОГЭ. Русский</title>
  <link rel="stylesheet" href="../css/style.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Merriweather:wght@400;700&display=swap" rel="stylesheet">
  <style>
    .search-box {
      margin: 1.5rem 0;
      display: flex;
      gap: 0.75rem;
    }
    .search-box input {
      flex: 1;
      padding: 0.75rem 1rem;
      border: 1px solid var(--border);
      border-radius: 8px;
      font-size: 1rem;
      background: var(--bg-card);
      color: var(--text);
    }
    .concepts-list {
      display: grid;
      gap: 1.25rem;
    }
    .concept-card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 1.5rem;
      box-shadow: var(--shadow);
    }
    .concept-card h2 {
      font-family: var(--font-serif);
      font-size: 1.4rem;
      color: var(--primary);
      margin-bottom: 0.5rem;
    }
    .definition {
      margin-bottom: 1rem;
      font-size: 1.05rem;
    }
    .themes {
      margin-bottom: 0.75rem;
    }
    .themes span {
      display: inline-block;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 0.25rem 0.75rem;
      font-size: 0.85rem;
      margin: 0.2rem 0.3rem 0.2rem 0;
    }
    .args {
      display: grid;
      gap: 0.5rem;
      font-size: 0.95rem;
      color: var(--text-muted);
    }
    .args strong {
      color: var(--text);
    }
    .page-header {
      padding: 2rem 0 0.5rem;
    }
    .page-header h1 {
      font-family: var(--font-serif);
      font-size: 1.9rem;
    }
  </style>
</head>
<body>
  <header class="header">
    <div class="container header-inner">
      <a href="../index.html" class="logo">
        <span class="logo-mark">13.3</span>
        <span class="logo-text">ОГЭ. Русский</span>
      </a>
      <nav class="nav">
        <a href="concepts.html">Понятия</a>
        <a href="texts.html">Тексты</a>
        <a href="essays.html">Сочинения</a>
        <a href="templates.html">Шаблоны</a>
        <a href="criteria.html">Критерии</a>
        <a href="methodology.html">Методика</a>
      </nav>
      <button class="theme-toggle" id="themeToggle">🌙</button>
    </div>
  </header>

  <main class="container">
    <div class="page-header">
      <h1>База понятий для сочинения 13.3</h1>
      <p style="color: var(--text-muted); margin-top: 0.5rem;">Определения, темы и готовые аргументы из открытого банка ФИПИ</p>
    </div>

    <div class="search-box">
      <input type="search" id="searchInput" placeholder="Поиск по понятиям, определениям, темам..." autocomplete="off">
    </div>

    <div class="concepts-list" id="conceptsList">
      <!-- Заполняется из JSON -->
    </div>
  </main>

  <footer class="footer">
    <div class="container">
      <p>ОГЭ. Русский — Учительский кабинет &copy; 2026</p>
    </div>
  </footer>

  <script src="../js/main.js"></script>
  <script>
    async function loadConcepts() {
      const res = await fetch('../data/concepts.json');
      const data = await res.json();
      const list = document.getElementById('conceptsList');

      data.forEach(item => {
        const card = document.createElement('article');
        card.className = 'concept-card';
        card.innerHTML = `
          <h2>${item.title}</h2>
          <p class="definition"><strong>Определение:</strong> ${item.definition}</p>
          <div class="themes">
            <strong>Темы:</strong><br>
            ${item.themes.map(t => `<span>${t}</span>`).join('')}
          </div>
          <div class="args">
            <div><strong>Литература:</strong> ${item.arguments.literature}</div>
            <div><strong>Жизнь:</strong> ${item.arguments.life}</div>
          </div>
        `;
        list.appendChild(card);
      });

      // Activate search
      filterList('searchInput', '#conceptsList', '.concept-card');
    }

    loadConcepts();
  </script>
</body>
</html>
